services:
  postgres:
    image: postgres:18
    container_name: trading_postgres
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading
      POSTGRES_DB: trading_tool
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data_v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading_tool"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: trading_redis
    ports:
      - "127.0.0.1:6379:6379"

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    env_file:
      - .env.example
    environment:
      APP_MODE: ${APP_MODE:-operational}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: trading_api
    env_file:
      - .env.example
    environment:
      APP_MODE: ${APP_MODE:-operational}
      ALPACA_API_KEY_ID: ${ALPACA_API_KEY_ID:-}
      ALPACA_API_SECRET_KEY: ${ALPACA_API_SECRET_KEY:-}
      ALPACA_TRADING_BASE_URL: ${ALPACA_TRADING_BASE_URL:-https://paper-api.alpaca.markets}
      ALPACA_TRADE_STREAM_URL: ${ALPACA_TRADE_STREAM_URL:-wss://paper-api.alpaca.markets/stream}
      ALPACA_DATA_BASE_URL: ${ALPACA_DATA_BASE_URL:-https://data.alpaca.markets}
      ALPACA_SCANNER_FEED: ${ALPACA_SCANNER_FEED:-delayed_sip}
      ALPACA_EXECUTION_FEED: ${ALPACA_EXECUTION_FEED:-iex}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
      AUTOMATION_POLL_SECONDS: ${AUTOMATION_POLL_SECONDS:-5}
      BROKER_STREAM_RECONNECT_MIN_SECONDS: ${BROKER_STREAM_RECONNECT_MIN_SECONDS:-1}
      BROKER_STREAM_RECONNECT_MAX_SECONDS: ${BROKER_STREAM_RECONNECT_MAX_SECONDS:-30}
      AUTOMATION_QUOTE_MAX_AGE_SECONDS: ${AUTOMATION_QUOTE_MAX_AGE_SECONDS:-60}
      AUTOMATION_MAX_PRICE_DEVIATION_PCT: ${AUTOMATION_MAX_PRICE_DEVIATION_PCT:-2.0}
      ALLOW_LIVE_TRADING: ${ALLOW_LIVE_TRADING:-false}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: trading_paper_automation_worker
    command: ["python", "-m", "app.worker"]
    env_file:
      - .env.example
    environment:
      APP_MODE: ${APP_MODE:-operational}
      ALPACA_API_KEY_ID: ${ALPACA_API_KEY_ID:-}
      ALPACA_API_SECRET_KEY: ${ALPACA_API_SECRET_KEY:-}
      ALPACA_TRADING_BASE_URL: ${ALPACA_TRADING_BASE_URL:-https://paper-api.alpaca.markets}
      ALPACA_TRADE_STREAM_URL: ${ALPACA_TRADE_STREAM_URL:-wss://paper-api.alpaca.markets/stream}
      ALPACA_DATA_BASE_URL: ${ALPACA_DATA_BASE_URL:-https://data.alpaca.markets}
      ALPACA_SCANNER_FEED: ${ALPACA_SCANNER_FEED:-delayed_sip}
      ALPACA_EXECUTION_FEED: ${ALPACA_EXECUTION_FEED:-iex}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
      AUTOMATION_POLL_SECONDS: ${AUTOMATION_POLL_SECONDS:-5}
      BROKER_STREAM_RECONNECT_MIN_SECONDS: ${BROKER_STREAM_RECONNECT_MIN_SECONDS:-1}
      BROKER_STREAM_RECONNECT_MAX_SECONDS: ${BROKER_STREAM_RECONNECT_MAX_SECONDS:-30}
      AUTOMATION_QUOTE_MAX_AGE_SECONDS: ${AUTOMATION_QUOTE_MAX_AGE_SECONDS:-60}
      AUTOMATION_MAX_PRICE_DEVIATION_PCT: ${AUTOMATION_MAX_PRICE_DEVIATION_PCT:-2.0}
      ALLOW_LIVE_TRADING: ${ALLOW_LIVE_TRADING:-false}
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
        API_INTERNAL_BASE_URL: http://api:8000
    container_name: trading_web
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api
      API_INTERNAL_BASE_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data_v18:
